  <body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-amber-500 selection:text-slate-950">
    <div id="root"></div>
    <script>
      // Nuclear cleanup & quota protection: runs BEFORE any JS bundle loads
      (function() {
        try { localStorage.clear(); } catch(e) {}
        try { sessionStorage.clear(); } catch(e) {}
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            regs.forEach(function(r) { r.unregister(); });
          });
        }
        if ('caches' in window) {
          caches.keys().then(function(names) {
            names.forEach(function(name) { caches.delete(name); });
          });
        }
        // Monkey-patch setItem to prevent QuotaExceededError from breaking the app
        var origLocal = localStorage.setItem;
        localStorage.setItem = function(k, v) {
          try { origLocal.call(localStorage, k, v); }
          catch(err) {
            try { localStorage.clear(); origLocal.call(localStorage, k, v); }
            catch(err2) { console.warn('Ignorado error de cuota en localStorage:', k); }
          }
        };
        var origSession = sessionStorage.setItem;
        sessionStorage.setItem = function(k, v) {
          try { origSession.call(sessionStorage, k, v); }
          catch(err) {
            try { sessionStorage.clear(); origSession.call(sessionStorage, k, v); }
            catch(err2) { console.warn('Ignorado error de cuota en sessionStorage:', k); }
          }
        };
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
